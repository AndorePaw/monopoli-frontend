<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b2a42">
<title>Monopoli Kota</title>
<style>
:root{
  --bg:#e6f0f8;--fg:#10202e;--card:#fff;--card2:#eef3f8;--line:#c5d1dc;--muted:#44566a;
  --btn:#1565ff;--btn2:#0b4fd0;--danger:#c62828;--ok:#1b7a37;
  --sea1:#7fd0ee;--sea2:#2f8fc4;--stone:#9aa3ab;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --rx:34deg;--sy:1.206;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a1520;--fg:#e8f0f7;--card:#15222f;--card2:#1d2d3d;--line:#2b3f52;--muted:#b0c0cf;
    --btn:#2a6bff;--btn2:#1b54d6;--sea1:#14506f;--sea2:#0a2438;--stone:#5d666e;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;position:relative;overflow:hidden}
button:disabled{cursor:default}
.hide{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 14px) calc(var(--sal) + 16px)}
/* tombol umum */
.btn{min-height:52px;padding:0 18px;border-radius:16px;font-weight:700;font-size:16px;background:var(--card2);color:var(--fg);border:1px solid var(--line);
  transition:transform .08s,box-shadow .08s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.pri{background:linear-gradient(#2f7bff,var(--btn2));color:#fff;border:0;box-shadow:0 4px 0 #0a3a9a,0 8px 18px rgba(21,101,255,.45)}
.btn.pri:active:not(:disabled){box-shadow:0 1px 0 #0a3a9a,0 3px 8px rgba(21,101,255,.4);transform:translateY(3px) scale(.98)}
.btn.dng{background:var(--danger);color:#fff;border:0}
.btn:disabled{opacity:.55}
.btn.pri:disabled{box-shadow:none;background:#5a6b80}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* ===== HOME ===== */
#scrHome{overflow:auto;background:linear-gradient(180deg,var(--sea1),var(--sea2));color:#fff}
#scrHome .inner{margin:auto 0 0;display:flex;flex-direction:column;gap:12px;max-width:420px;width:100%;align-self:center}
.logo{text-align:center;margin:auto 0 8px;font-weight:900;letter-spacing:2px}
.logo .cube3{width:70px;height:70px;margin:0 auto 14px;position:relative;transform-style:preserve-3d;animation:spin 7s linear infinite}
.logo .cube3 i{position:absolute;inset:0;border-radius:12px;background:#fff;color:#c62828;font-size:38px;display:grid;place-items:center;font-style:normal;border:2px solid #cfd8dc}
.logo .cube3 i:nth-child(1){transform:translateZ(35px)}.logo .cube3 i:nth-child(2){transform:rotateY(90deg) translateZ(35px)}
.logo .cube3 i:nth-child(3){transform:rotateY(180deg) translateZ(35px)}.logo .cube3 i:nth-child(4){transform:rotateY(-90deg) translateZ(35px)}
@keyframes spin{to{transform:rotateX(-18deg) rotateY(360deg)}}
.logo h1{margin:0;font-size:40px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo h1 span{display:inline-block;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.logo p{margin:6px 0 0;font-size:14px;opacity:.95}
.panel{background:var(--card);color:var(--fg);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.panel label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:2px 0 6px}
.panel input[type=text]{width:100%;height:50px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--fg);padding:0 14px;font:700 17px system-ui;outline:0}
.panel input[type=text]:focus{border-color:var(--btn)}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.av-opt{width:46px;height:46px;border-radius:14px;background:var(--card2);border:2px solid transparent;font-size:24px;display:grid;place-items:center}
.av-opt.sel{border-color:var(--btn);background:#dbe8ff}
@media (prefers-color-scheme:dark){.av-opt.sel{background:#243b66}}
.col-opt{width:36px;height:36px;border-radius:50%;border:3px solid transparent;margin:5px 4px}
.col-opt.sel{border-color:var(--fg);box-shadow:0 0 0 2px var(--card) inset}
.row{display:flex;gap:10px}
.row>*{flex:1}
.codebox{display:flex;gap:8px;flex:1.4}
.codebox input{width:100%;min-width:0;height:56px;text-align:center;font:900 26px system-ui;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--fg);padding:0;text-transform:uppercase;outline:0}
.codebox input:focus{border-color:var(--btn)}
.msg{min-height:18px;color:#ffe082;font-size:13px;font-weight:700;text-align:center}
/* ===== LOBBY ===== */
#scrLobby{background:linear-gradient(180deg,var(--sea1),var(--sea2));color:#fff;overflow:auto}
.codebig{background:rgba(255,255,255,.18);border-radius:22px;padding:14px;text-align:center;margin-top:6px}
.codebig small{font-size:13px;font-weight:700}
.codebig .c{font-size:56px;font-weight:900;letter-spacing:12px;padding-left:12px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.plist{display:flex;flex-direction:column;gap:8px;margin:12px 0;flex:1}
.pl{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--fg);border-radius:16px;padding:8px 10px;animation:pop .35s cubic-bezier(.2,1.4,.4,1);border-left:8px solid var(--pc)}
@keyframes pop{from{transform:scale(.6) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.pl .e{font-size:28px;width:40px;height:40px;display:grid;place-items:center;background:var(--card2);border-radius:12px}
.pl .n{flex:1;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--muted)}
.chip.ok{background:#c8f0d2;color:#0d5a26}
.kick{width:44px;height:44px;border-radius:12px;background:var(--card2);font-size:18px}
/* ===== GAME ===== */
#scrGame{padding:0;background:linear-gradient(180deg,var(--sea1) 0%,var(--sea2) 100%);touch-action:none;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;overflow:hidden}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
#persp{position:absolute;inset:0;perspective:3200px}
#board{position:absolute;left:50%;top:50%;width:616px;height:616px;margin:-308px 0 0 -308px;transform-style:preserve-3d;transform:rotateX(var(--rx))}
#board .lay{position:absolute;inset:-6px;border-radius:14px}
#board .shadow{position:absolute;inset:-6px;border-radius:14px;background:rgba(0,0,0,.35);filter:blur(14px);transform:translateZ(-30px) translate(8px,22px)}
/* petak: kartu krem + pita warna di sisi dalam + gambar */
.tile{position:absolute;overflow:hidden;border:1px solid rgba(0,0,0,.5);transform-style:flat;color:#10202e;
  background-image:linear-gradient(180deg,rgba(255,255,255,.55),rgba(0,0,0,.05))}
.tile .band{position:absolute;background:var(--bc);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.tile.sb .band{left:0;right:0;top:0;height:9px}
.tile.st .band{left:0;right:0;bottom:0;height:9px}
.tile.sl .band{top:0;bottom:0;right:0;width:9px}
.tile.sr .band{top:0;bottom:0;left:0;width:9px}
.tile .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;
  transform:scaleY(var(--sy));pointer-events:none}
.tile.sb .in{padding-top:calc(9px / var(--sy))}.tile.st .in{padding-bottom:calc(9px / var(--sy))}
.tile.sl .in{padding-right:9px}.tile.sr .in{padding-left:9px}
.tile .ic{display:block;font-size:19px;line-height:1.05;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.tile b{display:block;font-weight:800;font-size:7.6px;max-width:46px;word-break:break-word;margin-top:1px}
.tile i{display:block;font-style:normal;font-weight:800;font-size:7.4px;margin-top:1px;opacity:.85}
.tile.corner .ic{font-size:27px}.tile.corner b{font-size:8.5px;max-width:52px}
.tile .ow{position:absolute;inset:0;pointer-events:none;border:0 solid var(--oc)}
.tile.owned .ow{border-width:4px;box-shadow:inset 0 0 8px rgba(0,0,0,.25)}
.tile .ob{position:absolute;right:2px;bottom:1px;font-size:11px;transform:scaleY(var(--sy));display:none;pointer-events:none}
.tile.owned .ob{display:block}
.tile.sel{outline:3px solid #fff;outline-offset:-3px}
#center9{position:absolute;left:56px;top:56px;width:504px;height:504px;border-radius:10px;transform-style:preserve-3d;pointer-events:none;background:#b5d8a0 center/100% 100%}
.bx{position:absolute;transform-style:preserve-3d;pointer-events:none}
.bx>div{position:absolute}
.bx .tp{inset:0}
.bx .fy{left:0;transform-origin:0 0;transform:rotateX(90deg)}
.bx .fx{top:0;transform-origin:0 0;transform:rotateY(-90deg)}
.flat{position:absolute;pointer-events:none;transform-origin:50% 50%}
.logoPlate{left:132px;top:166px;width:240px;height:58px;border-radius:14px;background:linear-gradient(135deg,#ff7043,#d81b60);color:#fff;border:3px solid #fff;
  box-shadow:0 3px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;transform:scaleY(var(--sy))}
.logoPlate b{font-size:25px;letter-spacing:3px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.logoPlate span{font-size:10px;letter-spacing:5px;margin-top:2px;opacity:.95}
.deck{width:92px;height:62px;border-radius:9px;border:3px solid #fff;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:9.5px;
  letter-spacing:.5px;box-shadow:0 2px 0 rgba(0,0,0,.28),3px 3px 0 rgba(255,255,255,.35)}
.deck em{font-style:normal;font-size:24px;line-height:1}
.deck.d1{left:140px;top:246px;background:linear-gradient(135deg,#ff9800,#e91e63);transform:rotate(-6deg) scaleY(var(--sy))}
.deck.d2{left:272px;top:246px;background:linear-gradient(135deg,#29b6f6,#3949ab);transform:rotate(6deg) scaleY(var(--sy))}
.hs{position:absolute;transform-style:preserve-3d;pointer-events:none;width:56px;height:56px}
.hh{position:absolute;width:0;height:0;transform-style:preserve-3d;pointer-events:none}
.hh .sh{position:absolute;left:-8px;top:-3px;width:16px;height:6px;border-radius:50%;background:var(--oc,rgba(0,0,0,.4));opacity:.55}
.hh .up{position:absolute;left:-11px;top:-21px;width:22px;height:21px;font-size:17px;line-height:21px;text-align:center;transform-origin:50% 100%;
  transform:rotateX(calc(var(--rx) * -1));filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.hh.hotel .up{left:-17px;top:-36px;width:34px;height:36px;font-size:30px;line-height:36px}
.hh.hotel .sh{left:-15px;width:30px;height:9px}
.hh.deco .up{font-size:21px}
.tok{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;pointer-events:none}
.tok .sh{position:absolute;left:-15px;top:-8px;width:30px;height:16px;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(2px)}
.tok .up{position:absolute;left:-16px;top:-58px;width:32px;height:58px;transform-origin:50% 100%;transform:rotateX(calc(var(--rx) * -1))}
.tok .hop{position:absolute;inset:0}
.tok .body{position:absolute;left:3px;bottom:0;width:26px;height:34px;clip-path:polygon(50% 0,100% 88%,88% 100%,12% 100%,0 88%);
  background:linear-gradient(100deg,rgba(255,255,255,.65) 0 14%,transparent 38%),radial-gradient(circle at 30% 20%,rgba(255,255,255,.4),transparent 50%),var(--pc);filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.tok .head{position:absolute;left:2px;top:0;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--pc);display:grid;place-items:center;font-size:16px;line-height:1;box-shadow:inset -3px -3px 0 rgba(0,0,0,.12),0 2px 3px rgba(0,0,0,.35)}
.tok.cur .head{animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px) scale(1.08)}}
.tok.dead{opacity:.18;filter:grayscale(1)}
/* laut + hiasan */
#stage::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='60'><path d='M0 18 Q15 6 30 18 T60 18 T90 18 T120 18' fill='none' stroke='white' stroke-opacity='.35' stroke-width='2'/><path d='M0 48 Q15 36 30 48 T60 48 T90 48 T120 48' fill='none' stroke='white' stroke-opacity='.22' stroke-width='2'/></svg>") 0 0/120px 60px}
.deco-sea{position:absolute;pointer-events:none;font-size:30px;animation:drift 22s ease-in-out infinite alternate;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
@keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#hudRow{position:absolute;left:calc(var(--sal) + 4px);right:calc(var(--sar) + 4px);top:calc(var(--sat) + 4px);display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
  padding:8px 6px 10px;pointer-events:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#hudRow::-webkit-scrollbar{display:none}
.pc{position:relative;flex:1 0 100px;min-width:100px;max-width:160px;display:flex;align-items:center;gap:6px;padding:5px 7px 5px 5px;border-radius:15px;background:var(--card);color:var(--fg);
  border:3px solid var(--pc);transition:box-shadow .3s,opacity .3s;box-shadow:0 3px 8px rgba(0,0,0,.25);text-align:left}
.pc.act{z-index:2;box-shadow:0 0 0 3px #fff,0 0 14px 3px var(--pc)}
.pc.dead{opacity:.45}
.pc .av{position:relative;width:36px;height:36px;flex:none;display:grid;place-items:center;font-size:21px;background:var(--card2);border-radius:50%}
.pc .ring{position:absolute;inset:-3px;width:42px;height:42px;transform:rotate(-90deg)}
.pc .ring circle{fill:none;stroke-width:3.5}
.pc .ring .rb{stroke:transparent}
.pc .ring .rf{stroke:var(--pc);stroke-dasharray:119.4;stroke-dashoffset:0}
.pc .inf{min-width:0;flex:1}
.pc .nm{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .cs{font-weight:800;font-size:12px;color:var(--ok);white-space:nowrap}
.pc .as{font-size:10px;color:var(--muted);white-space:nowrap}
.pc .st{position:absolute;top:1px;right:3px;font-size:15px}
#toolbar{position:absolute;left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);top:calc(var(--sat) + 78px);height:38px;display:flex;align-items:center;gap:5px;z-index:6;pointer-events:none}
#toolbar button{width:38px;height:38px;flex:none;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:17px;box-shadow:0 2px 6px rgba(0,0,0,.2);pointer-events:auto}
#sumChip{flex:1;min-width:0;height:38px;border-radius:12px;background:rgba(255,255,255,.92);color:#10202e;font-weight:800;font-size:12.5px;display:flex;align-items:center;padding:0 9px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#sumChip.on{opacity:1}
#center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;gap:26px;pointer-events:none;z-index:4}
.die{width:46px;height:46px;position:relative;perspective:520px}
.cube{width:46px;height:46px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;background:#fff;border-radius:9px;border:1px solid #aab;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;backface-visibility:hidden;box-shadow:inset 0 0 8px rgba(0,0,0,.12)}
.pip{background:#1c1c1c;border-radius:50%;margin:1px}
.face.f1 .pip{background:#d32f2f}
.dshadow{position:absolute;left:6px;right:6px;bottom:-12px;height:9px;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(3px)}
#dock{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:8px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);
  display:flex;flex-direction:column;gap:8px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.28))}
#dock>*{width:100%;max-width:420px}
#pr{display:flex;gap:6px;align-items:center}
#pill{flex:1;min-width:0;height:40px;border-radius:99px;background:var(--card);padding:0 14px;display:flex;align-items:center;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid var(--pc,var(--line))}
.rx{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:19px;flex:none}
#mainBtn{min-height:62px;font-size:19px;letter-spacing:.5px}
#mainBtn.pulse:not(:disabled){animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 #0a3a9a,0 0 0 0 rgba(47,123,255,.7)}50%{box-shadow:0 4px 0 #0a3a9a,0 0 0 14px rgba(47,123,255,0)}}
#sec{display:flex;gap:8px}
#sec .btn{flex:1;min-height:48px;font-size:14px;padding:0 6px}
/* sheet */
#sheetBack{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#sheetBack.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:82vh;max-height:82dvh;overflow:auto;background:var(--card);color:var(--fg);border-radius:24px 24px 0 0;
  padding:10px 16px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:480px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
#sheet.on{transform:none}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.deed{border:2px solid var(--fg);border-radius:12px;overflow:hidden;background:#fffdf5;color:#10202e;margin-bottom:12px}
.deed .rb{padding:12px;text-align:center;font-weight:900;font-size:18px;border-bottom:2px solid #10202e}
.deed .bd{padding:10px 14px;font-size:14px}
.deed table{width:100%;border-collapse:collapse;font-size:14px}
.deed td{padding:3px 0}.deed td:last-child{text-align:right;font-weight:800}
.deed .own{margin-top:8px;font-weight:800}
.sh2{display:flex;flex-direction:column;gap:8px}
.h3{font-size:18px;font-weight:900;margin:2px 0 10px}
.seg{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.seg button{flex:none;padding:8px 12px;border-radius:99px;background:var(--card2);font-weight:800;font-size:13px;min-height:44px;border:2px solid transparent}
.seg button.sel{border-color:var(--btn)}
.grp{border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--card2);border-left:10px solid var(--gc)}
.grp .t{font-size:12px;font-weight:800;color:var(--muted)}
.grp .it{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;font-weight:700}
.grp .it span{flex:1}
.grp .bb{min-height:44px;padding:0 12px;border-radius:12px;background:var(--btn);color:#fff;font-weight:800;font-size:13px}
.grp .bb:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap}.chp{display:inline-block;margin:4px 4px 0 0;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800}
.logl{font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;font-weight:700}
.tog .sw{display:flex;gap:6px}
.tog .sw button{padding:0 14px;min-height:44px;border-radius:12px;background:var(--card2);font-weight:800;border:2px solid transparent}
.tog .sw button.sel{border-color:var(--btn);background:#dbe8ff;color:#10202e}
/* toasts, banner, overlays */
#toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + 62px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none}
.toast{background:rgba(16,32,46,.94);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:14px;max-width:88vw;text-align:center;animation:tin .25s ease-out}
.toast.err{background:#b71c1c}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

(function (g) {

    const lt = cv(512, 128, (x, w, h) => {

    [['❓', 'KESEMPATAN', '#ff9800', '#e91e63', -7, .12], ['🎁', 'DANA UMUM', '#29b6f6', '#3949ab', 7, -.12]].forEach(([e, n, c1, c2, x, ry]) => {

/* ============ EVENT ANIMASI ============ */
async function playEvents(evs, ep) {
  const f = factor(), live = () => ep === playEpoch;
  for (const e of evs) {
    if (!live()) return;
    if (e.k === 'dice') { curDice = e.d; await rollDice(e.d); setSum(e.d); }
    else if (e.k === 'mv') await doMove(e, live);
    else if (e.k === 'tp') await doTp(e);
    else if (e.k === '$') { await doMoney(e); }
    else if (e.k === 'card') await showCard(e);
    else if (e.k === 'own') await doOwn(e);
    else if (e.k === 'bd') {
      if (camOk()) { if (!savedCam) savedCam = true; await camFocus(e.i, 2.0, 420 * f); }
      sfx.build(); vib(30); renderHouses(e.i, e.h, true); await sleep(800 * f);
    }
    else if (e.k === 'bk') { if (G3) G3.setDead(e.p, true); const hc = hudEls[e.p]; if (hc) hc.classList.add('dead'); sfx.jail(); vib(200); await sleep(900 * f); }
    else if (e.k === 'win') { sfx.win(); confetti(); await sleep(400); }
    else if (e.k === 'start') { await sleep(900 * f); }
  }
  if (live()) await camRestore();
}

/* --- gerak --- */
async function doMove(e, live) {
  const el = toks[e.p]; if (!el) return; const k0 = pidx(e.p), f = factor(), stepMs = Math.round(240 * f);
  setTok(el, e.from, k0); // pastikan bidak mulai tepat dari petak asal
  if (camOk() && e.steps > 0) { if (!savedCam) savedCam = true; await camFocus(e.from, 1.9, 380); }
  for (let k = 1; k <= e.steps; k++) {
    if (live && !live()) return;
    const t = (e.from + k) % 40;
    setSum(curDice, k, e.steps);
    if (camOk()) camFocus(t, 1.9, stepMs);
    sfx.step(); await hopTok(el, t, k0, stepMs, 1.4);
  }
  setSum(curDice);
  await sleep(120 * f);
}

}

function tweenCash(id, to, ms) {
  // batalkan animasi $ sebelumnya untuk player ini supaya dua tween tidak rebutan nulis disp[id]
  if (cashRaf[id]) { cancelAnimationFrame(cashRaf[id]); cashRaf[id] = 0; }

  const from = disp[id] || 0, t0 = performance.now();
  const f = now => {

    if (k < 1) cashRaf[id] = requestAnimationFrame(f); else cashRaf[id] = 0;
  };

}

function canBuild(i) {

  const s = B[i]; if (!s || s.t !== 'prop' || S.owner[i] !== me.id) return false;
  const g = GROUPS[s.g]; if (!g.every(x => S.owner[x] === me.id)) return false;
  const h = S.houses[i] || 0; if (h >= 5) return false;
  if (h > Math.min(...g.map(x => S.houses[x] || 0))) return false;
  return mp.cash >= HC[s.g];
}

$('#mainBtn').onclick = () => {
  const b = $('#mainBtn');
  if (!b.dataset.a && b.textContent === 'Coba lagi') { renderDock(); if (sock && sock.connected) sock.emit('sync'); return; } // pulihkan dari error render sebelumnya
  const a = b.dataset.a; if (busy || !a || b.disabled) return;
  if (a === 'openbuy') { sheetKind = ''; openBuy(); return; }
  act(a); b.disabled = true; mainBtnLockedAt = Date.now();
  setTimeout(() => { if (view === 'game' && !busy) renderDock(); }, 2500); // jaga-jaga kalau balasan server tidak datang
};
$('#sec').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const a = b.dataset.a;
  if (a === 'assets') openAssets(me.id); else if (a === 'build') openAssets(me.id, true);
  else if (a === 'buildhere') { const mp = meP(); if (mp) act('build', mp.pos); }
  else if (a === 'payjail') act('payjail'); else if (a === 'exit') confirmExit();
};
$$('.rx').forEach(b => b.onclick = () => sock.emit('react', b.dataset.e));
$('#bMute').onclick = () => { cfgv.mute = !cfgv.mute; saveCfg(); };
$('#bLog').onclick = openLog;
$('#bMenu').onclick = openMenu;
setInterval(() => { if (view === 'game' && S && !busy) { const cur = P(S.cur), rem = Math.max(0, Math.ceil((S.deadline - (Date.now() + offset)) / 1000)); if (cur && S.deadline) $('#pill').textContent = `Giliran: ${cur.emoji} ${cur.name} · ${Math.min(60, rem)}s`; } }, 500);
// sinkronkan state secara berkala & saat tab kembali aktif (cegah macet karena paket hilang)
setInterval(() => { if (S && sock && sock.connected && !busy && !document.hidden) sock.emit('sync'); }, 6000);
// WATCHDOG: kalau tombol utama kepencet-disable lebih dari ~4 detik tanpa ada state baru masuk,
// paksa minta state terbaru ke server (ganti kebutuhan refresh manual browser).
setInterval(() => {
  if (view !== 'game' || !S || busy || document.hidden || !sock || !sock.connected) return;
  const b = $('#mainBtn');
  if (b && b.disabled && mainBtnLockedAt && Date.now() - mainBtnLockedAt > 4000) {
    mainBtnLockedAt = 0;
    console.warn('[watchdog] tombol kedeteksi macet, paksa sync ulang');
    sock.emit('sync');
  }
}, 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && sock && sock.connected) sock.emit('sync'); });

let gameInit = false;
function renderGame() {
  if (!gameInit) { buildDice(); gameInit = true; }
  if (!boardBuilt && B) { buildBoard(); fitCam(); }
  if (!B) return;
  placeDice();
  // pemilik & rumah dari state (kecuali sedang animasi)
  if (!busy) B.forEach((s, i) => {
    if (!['prop', 'rr', 'util'].includes(s.t)) return;
    paintTile(i, S.owner[i] || null);
    if (s.t === 'prop') { const n = S.houses[i] || 0; if ((hsN[i] || 0) !== n || (hsN[i] === undefined && n)) renderHouses(i, n); }
  });
  syncToks();
  if (!busy) setDice(S.dice[0] ? S.dice : [1, 1]);
  renderHud(); renderDock();
  // kartu beli untuk pemain aktif
  if (S.phase === 'buy' && S.cur === me.id && !busy) openBuy(); else if (sheetKind === 'buy') closeSheet();
  const my = S.cur === me.id && S.phase === 'roll';
  if (my && !wasMyTurn) vib([60, 40, 60]);
  wasMyTurn = my;
}

/* ============ SHEET ============ */
let sheetKind = '', sheetArg = null, sheetLock = false;
function openSheet(kind, html, lock, arg) {
  sheetKind = kind; sheetArg = arg; sheetLock = !!lock;
  $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet').classList.add('on'); $('#sheetBack').classList.toggle('on', !lock);
  $('#sheetBack').style.pointerEvents = lock ? 'none' : 'auto';
}
function closeSheet() {
  sheetKind = '';
  $('#sheet').classList.remove('on');
  $('#sheetBack').classList.remove('on');
  $('#sheetBack').style.pointerEvents = 'none';   // ← RESET INLINE STYLE (fix bug)
  // kalau sedang fase beli dan kartu beli tertutup, buka lagi supaya tidak macet
  if (S && view === 'game' && S.phase === 'buy' && S.cur === me.id && !busy) setTimeout(() => { if (!sheetKind && S && S.phase === 'buy' && S.cur === me.id && !busy) openBuy(); }, 350);
    }
$('#sheetBack').onclick = () => { if (!sheetLock) closeSheet(); };
$('#sheet').onclick = e => {
  const b = e.target.closest('[data-do]'); if (!b || b.disabled) return; const d = b.dataset.do;
  if (d === 'close') closeSheet();
  else if (d === 'buy') { act('buy'); b.disabled = true; setTimeout(recover, 3000); }
  else if (d === 'skip') { act('skip'); b.disabled = true; setTimeout(recover, 3000); }
  else if (d === 'build') { act('build', +b.dataset.i); b.disabled = true; setTimeout(recover, 3000); }
  else if (d === 'seg') openAssets(b.dataset.id, sheetArg && sheetArg.build);
  else if (d === 'exit') { sock.emit('leave'); leaveLocal(); }
  else if (d === 'anim') { cfgv.anim = b.dataset.v; saveCfg(); openMenu(); }
  else if (d === 'auto') { cfgv.auto = b.dataset.v === '1'; saveCfg(); openMenu(); }
  else if (d === 'snd') { cfgv.mute = b.dataset.v === '0'; saveCfg(); openMenu(); }
  else if (d === 'tut') { closeSheet(); openTut(true); }
  else if (d === 'exitask') confirmExit();
};
function refreshSheet() {
  if (!sheetKind || !S) return;
  if (sheetKind === 'assets') openAssets(sheetArg.pid, sheetArg.build, true);
  else if (sheetKind === 'tile') openTile(sheetArg, true);
}
function deedHTML(i) {
  const s = B[i], own = S.owner[i] && P(S.owner[i]); let band, col = '#fff', body = '';
  if (s.t === 'prop') {
    const base = Math.round(s.p / 16), g = GCOL[s.g]; band = g[0]; col = g[1];
    body = `<table><tr><td>Harga</td><td>${rp(s.p)}</td></tr><tr><td>Sewa tanah kosong</td><td>${rp(base)}</td></tr><tr><td>Set warna lengkap (2x)</td><td>${rp(base * 2)}</td></tr>` +
      [1, 2, 3, 4].map(n => `<tr><td>${n} rumah</td><td>${rp(base * RM_[n])}</td></tr>`).join('') + `<tr><td>Hotel</td><td>${rp(base * RM_[5])}</td></tr><tr><td>Harga bangun (per rumah)</td><td>${rp(HC[s.g])}</td></tr></table>`;
  } else if (s.t === 'rr') { band = TCOL.rr[0]; col = '#fff'; body = `<table><tr><td>Harga</td><td>${rp(s.p)}</td></tr><tr><td>Sewa 1 bandara</td><td>${rp(25)}</td></tr><tr><td>2 bandara</td><td>${rp(50)}</td></tr><tr><td>3 bandara</td><td>${rp(100)}</td></tr><tr><td>4 bandara</td><td>${rp(200)}</td></tr></table>`; }
  else if (s.t === 'util') { band = TCOL.util[0]; col = '#10202e'; body = `<table><tr><td>Harga</td><td>${rp(s.p)}</td></tr><tr><td>Sewa (punya 1)</td><td>4x dadu</td></tr><tr><td>Sewa (punya keduanya)</td><td>10x dadu</td></tr></table>`; }
  else { const k = TCOL[s.t]; band = k[0]; col = k[1]; const txt = { go: 'Lewat START: terima ' + rp(200), tax: 'Bayar ' + rp(s.p) + ' ke bank', chance: 'Ambil kartu Kesempatan', chest: 'Ambil kartu Dana Umum', jail: 'Hanya berkunjung (atau dipenjara)', free: 'Istirahat, tidak ada apa-apa', gotojail: 'Langsung masuk penjara!' }[s.t]; body = `<div style="padding:4px 0">${txt}</div>`; }
  let o = '';
  if (['prop', 'rr', 'util'].includes(s.t)) { const h = S.houses[i] || 0; o = `<div class="own">${own ? `Pemilik: ${esc(own.emoji)} ${esc(own.name)}${s.t === 'prop' ? ' · ' + (h >= 5 ? '🏨 Hotel' : h + ' rumah') : ''}` : 'Belum ada pemilik'}</div>`; }
  return `<div class="deed"><div class="rb" style="background:${band};color:${col}">${ICON[i] || ''} ${esc(s.n)}</div><div class="bd">${body}${o}</div></div>`;
}
function openTile(i, quiet) {
  if (!S || !B || sheetKind === 'buy') return;
  if (!quiet && sheetKind === 'tile' && sheetArg === i) { closeSheet(); return; }
  let btn = '';
  if (B[i].t === 'prop' && S.owner[i] === me.id) {
    const ok = canBuild(i), h = S.houses[i] || 0;
    btn = h >= 5 ? '<button class="btn" disabled style="width:100%">🏨 Sudah hotel</button>' : `<button class="btn pri" data-do="build" data-i="${i}" ${ok ? '' : 'disabled'} style="width:100%">🏠 Bangun ${h >= 4 ? 'hotel' : 'rumah'} (${rp(HC[B[i].g])})</button><div style="font-size:12px;color:var(--muted);margin-top:6px;text-align:center">${ok ? '' : 'Butuh giliranmu, set warna lengkap, bangun merata, dan uang cukup'}</div>`;
  }
  openSheet('tile', deedHTML(i) + btn + '<button class="btn" data-do="close" style="width:100%;margin-top:8px">Tutup</button>', false, i);
}
function openBuy() {
  if (sheetKind === 'buy') return; const pb = S.pendingBuy; if (!pb) return; const mp = meP(), left = mp.cash - pb.price;
  openSheet('buy', deedHTML(pb.i) + `<div style="text-align:center;font-weight:800;margin-bottom:10px;color:${left < 0 ? 'var(--danger)' : 'var(--fg)'}">${left < 0 ? 'Uang tidak cukup' : 'Sisa uang setelah beli: ' + rp(left)}</div><div class="row"><button class="btn" data-do="skip" style="min-height:56px">Lewati</button><button class="btn pri" data-do="buy" ${left < 0 ? 'disabled' : ''} style="min-height:56px">Beli ${rp(pb.price)}</button></div>`, true);
}
function openAssets(pid, build, quiet) {
  if (!S || !B) return; const all = pid === 'all', p = all ? null : (P(pid) || meP());
  const seg = '<div class="seg"><button data-do="seg" data-id="all" class="' + (all ? 'sel' : '') + '">👥 Semua</button>' + S.players.map(x => `<button data-do="seg" data-id="${esc(x.id)}" class="${p && x.id === p.id ? 'sel' : ''}">${esc(x.emoji)} ${esc(x.name)}</button>`).join('') + '</div>';
  let html;
  if (all) {
    html = '<div class="h3">👥 Aset semua pemain</div>' + seg + S.players.slice().sort((a, b) => b.total - a.total).map(x => {
      const chips = x.props.slice().sort((a, b) => a - b).map(i => {
        const s = B[i], c = s.t === 'prop' ? GCOL[s.g] : (s.t === 'rr' ? [TCOL.rr[0], '#fff'] : [TCOL.util[0], '#10202e']), h2 = S.houses[i] || 0;
        return `<span class="chp" style="background:${c[0]};color:${c[1]}">${ICON[i] || ''} ${esc(s.n)}${h2 ? (h2 >= 5 ? ' 🏨' : ' ' + '🏠'.repeat(h2)) : ''}</span>`;
      }).join('') || '<span style="color:var(--muted);font-size:13px">Belum punya properti</span>';
      return `<div class="grp" style="--gc:${esc(x.color)}"><div class="t" style="color:var(--fg);font-size:14px">${esc(x.emoji)} ${esc(x.name)}${x.id === me.id ? ' (kamu)' : ''}${x.alive ? '' : ' 💀'}</div><div class="t">Uang ${rp(x.cash)} · Total ${rp(x.total)} · ${x.props.length} petak</div><div class="chips">${chips}</div></div>`;
    }).join('') + '<button class="btn" data-do="close" style="width:100%;margin-top:6px">Tutup</button>';
    const sc0 = $('#sheet').scrollTop; openSheet('assets', html, false, { pid: 'all', build }); if (quiet) $('#sheet').scrollTop = sc0; return;
  }
  const byG = {}; p.props.forEach(i => { const k = B[i].t === 'prop' ? B[i].g : B[i].t; (byG[k] = byG[k] || []).push(i); });
  html = `<div class="h3">${esc(p.emoji)} Aset ${esc(p.name)}</div>` + seg + `<div style="font-weight:800;margin-bottom:8px">Uang ${rp(p.cash)} · Total ${rp(p.total)}</div>`;
  const keys = Object.keys(byG);
  if (!keys.length) html += '<div style="color:var(--muted);padding:10px 0">Belum punya properti.</div>';
  keys.sort((a, b) => String(a).localeCompare(String(b))).forEach(k => {
    const isG = /^\d+$/.test(k), list = byG[k].sort((a, b) => a - b);
    const color = isG ? GCOL[k][0] : (k === 'rr' ? TCOL.rr[0] : TCOL.util[0]);
    const full = isG && GROUPS[k].every(x => S.owner[x] === p.id);
    html += `<div class="grp" style="--gc:${color}"><div class="t">${isG ? GNAME[k] : (k === 'rr' ? 'Bandara' : 'Perusahaan')}${full ? ' · ✅ Set lengkap' : isG ? ` · ${list.length}/${GROUPS[k].length}` : ''}</div>` +
      list.map(i => { const h = S.houses[i] || 0; return `<div class="it"><span>${ICON[i] || ''} ${esc(B[i].n)} ${h ? (h >= 5 ? '🏨' : '🏠'.repeat(h)) : ''}</span>${p.id === me.id && B[i].t === 'prop' ? `<button class="bb" data-do="build" data-i="${i}" ${canBuild(i) ? '' : 'disabled'}>Bangun ${rp(HC[B[i].g])}</button>` : ''}</div>`; }).join('') + '</div>';
  });
  html += '<button class="btn" data-do="close" style="width:100%;margin-top:6px">Tutup</button>';
  const sc = $('#sheet').scrollTop; openSheet('assets', html, false, { pid: p.id, build }); if (quiet) $('#sheet').scrollTop = sc;
}
function openLog() {
  if (!S) return; openSheet('log', '<div class="h3">📜 Riwayat</div>' + S.log.slice().reverse().map(l => `<div class="logl">${esc(l)}</div>`).join('') + '<button class="btn" data-do="close" style="width:100%;margin-top:10px">Tutup</button>');
}
function openMenu() {
  const sw = (k, opts, cur) => `<div class="sw">${opts.map(o => `<button data-do="${k}" data-v="${o[0]}" class="${String(cur) === String(o[0]) ? 'sel' : ''}">${o[1]}</button>`).join('')}</div>`;
  openSheet('menu', `<div class="h3">⚙️ Pengaturan</div>
    <div class="tog"><span>Animasi</span>${sw('anim', [['full', 'Penuh'], ['light', 'Ringan']], cfgv.anim)}</div>
    <div class="tog"><span>Kamera otomatis</span>${sw('auto', [['1', 'Nyala'], ['0', 'Mati']], cfgv.auto ? 1 : 0)}</div>
    <div class="tog"><span>Suara</span>${sw('snd', [['1', 'Nyala'], ['0', 'Bisu']], cfgv.mute ? 0 : 1)}</div>
    <div class="sh2" style="margin-top:8px"><button class="btn" data-do="tut">❔ Lihat tutorial</button><button class="btn dng" data-do="exitask">🚪 Keluar / Menyerah</button><button class="btn" data-do="close">Tutup</button></div>`);
}
function confirmExit() {
  const inGame = S && S.phase !== 'lobby' && S.phase !== 'over';
  openSheet('exit', `<div class="h3">${inGame ? 'Menyerah dan keluar?' : 'Keluar dari room?'}</div><p style="margin:0 0 14px;color:var(--muted)">${inGame ? 'Kamu akan dianggap bangkrut dan asetmu kembali ke bank. Ini tidak bisa dibatalkan.' : 'Kamu akan kembali ke layar awal.'}</p><div class="row"><button class="btn" data-do="close" style="min-height:56px">Batal</button><button class="btn dng" data-do="exit" style="min-height:56px">${inGame ? 'Ya, menyerah' : 'Ya, keluar'}</button></div>`, false);
}

/* ============ HASIL ============ */
function renderResult() {
  const st = S.stats ? S.stats.rows : S.players.map(p => ({ id: p.id, name: p.name, emoji: p.emoji, total: p.total, props: p.props.length, rent: 0, alive: p.alive }));
  const rows = st.slice().sort((a, b) => (b.id === S.winnerId) - (a.id === S.winnerId) || b.total - a.total);
  const w = rows[0]; $('#resTitle').textContent = w ? `🏆 ${w.name} menang!` : 'Game selesai';
  const order = [rows[1], rows[0], rows[2]], hs = [120, 170, 90], cl = ['#cfd8dc', '#fdd835', '#d7a06b'], nums = [2, 1, 3];
  $('#podium').innerHTML = order.map((r, k) => r ? `<div class="pod"><div class="e">${esc(r.emoji)}</div><div class="nm">${esc(r.name)}</div><div class="bar" style="height:${hs[k]}px;background:${cl[k]};animation-delay:${k === 1 ? .5 : k === 0 ? .25 : 0}s">${nums[k]}</div></div>` : '<div class="pod"></div>').join('');
  const best = (f, fmt) => { const m = rows.slice().sort((a, b) => f(b) - f(a))[0]; return m && f(m) > 0 ? `${esc(m.emoji)} ${esc(m.name)} (${fmt(f(m))})` : '-'; };
  $('#resStats').innerHTML = `<div class="stat"><b>💰 Uang & aset terbanyak</b>${best(r => r.total, rp)}</div><div class="stat"><b>🏙️ Properti terbanyak</b>${best(r => r.props, n => n + ' petak')}</div><div class="stat"><b>💸 Sewa terbayar terbanyak</b>${best(r => r.rent, rp)}</div>`;
  $('#resTbl').innerHTML = '<tr><th>Pemain</th><th>Aset</th><th>Properti</th><th>Sewa dibayar</th></tr>' + rows.map(r => `<tr><td>${esc(r.emoji)} ${esc(r.name)}${r.alive ? '' : ' 💀'}</td><td>${rp(r.total)}</td><td>${r.props}</td><td>${rp(r.rent)}</td></tr>`).join('');
  const b = $('#btnRematch'); b.textContent = isHost() ? '🔁 Main Lagi' : 'Menunggu host...'; b.disabled = !isHost();
  if (!renderResult.done) { renderResult.done = true; sfx.win(); confetti(); }
}
$('#btnRematch').onclick = () => { renderResult.done = false; sock.emit('rematch'); };
$('#btnResLeave').onclick = () => { sock.emit('leave'); renderResult.done = false; leaveLocal(); };

/* ============ TUTORIAL ============ */
const TUT = [['🎲', 'Lempar dadu', 'Saat gilirannya, ketuk tombol biru besar di bawah. Dadu kembar membuatmu jalan lagi.'], ['🏙️', 'Beli properti', 'Mendarat di tanah kosong? Beli lewat kartu, atau lewati. Pemain lain yang mampir harus bayar sewa.'], ['🏠', 'Bangun rumah', 'Kumpulkan satu set warna lengkap, lalu ketuk petaknya dan pilih Bangun. Sewa naik jauh.'], ['🏆', 'Cara menang', 'Bangkrutkan semua lawan. Pemain terakhir yang bertahan adalah pemenangnya!']];
let tutStep = 0;
function openTut(force) {
  if (!force && LS.get('mono_tut', '0') === '1') return; tutStep = 0; $('#tut').style.display = 'flex'; drawTut();
}
function drawTut() {
  const t = TUT[tutStep], last = tutStep === TUT.length - 1;
  $('#tut').innerHTML = `<div class="tc"><div class="big">${t[0]}</div><h3>${t[1]}</h3><p>${t[2]}</p><div class="dots">${TUT.map((_, k) => `<i class="${k === tutStep ? 'on' : ''}"></i>`).join('')}</div><div class="row"><button class="btn" id="tSkip" style="min-height:52px">Lewati</button><button class="btn pri" id="tNext" style="min-height:52px">${last ? 'Mengerti!' : 'Lanjut'}</button></div></div>`;
  $('#tSkip').onclick = endTut; $('#tNext').onclick = () => { if (last) endTut(); else { tutStep++; drawTut(); } };
}
function endTut() { $('#tut').style.display = 'none'; LS.set('mono_tut', '1'); }

/* ============ EFEK TAP ============ */
document.addEventListener('pointerdown', e => {
  ac(); const b = e.target.closest('button'); if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 1.6, d = document.createElement('span'); d.className = 'rip';
  d.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`; b.appendChild(d); setTimeout(() => d.remove(), 520);
  vib(8); sfx.click();
}, true);

/* ============ MULAI ============ */
saveCfg();
connect();
setTimeout(() => { hideSkel(); if (!view) show('home'); }, 7000);
setTimeout(() => { if (view === 'home' || view === 'lobby') openTut(false); }, 1200);
</script>
